<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Westeros — Guia da 1ª Temporada</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="Guia interativo cena a cena da 1ª temporada: mapa de Westeros e Essos, quem está em cada cena e trajetos sem spoiler.">
<meta name="theme-color" content="#0d0f14">

<style>
  html, body { margin: 0; padding: 0; background: #0d0f14; color: #ece5d3; }
  html, body, #raiz { height: 100%; }
  body { overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  #carregando {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 10px;
    text-align: center; font-family: Georgia, serif;
  }
  #carregando b { font-size: 15px; letter-spacing: .22em; color: #f0dfae; font-weight: 600; }
  #carregando span { font-size: 13px; color: #b0a890; font-style: italic; }
</style>
</head>
<body>
  <div id="raiz">
    <div id="carregando"><b>WESTEROS</b><span>desenrolando o mapa&hellip;</span></div>
  </div>
  <script src="./app.js" defer></script>
