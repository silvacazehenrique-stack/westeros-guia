    <!-- a Muralha -->
    <path d="M152 152 L296 145" stroke="#e8f5ff" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- marcador dourado sobre o continente -->
  <g transform="translate(212 268)">
