             Q186 424 226 428 Q262 434 288 414 Q312 392 302 360
             Q322 322 300 292 Q318 254 296 220 Q312 180 288 148
             Q272 108 232 90 Z"
          fill="url(#papel)"/>
    <!-- costa marcada -->
    <path d="M168 84 Q150 120 162 150 Q142 178 158 206
             Q136 240 156 270 Q134 306 154 338 Q140 372 162 398
             Q186 424 226 428 Q262 434 288 414 Q312 392 302 360
             Q322 322 300 292 Q318 254 296 220 Q312 180 288 148
             Q272 108 232 90 Z"
