<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="ceu" cx="46%" cy="34%" r="76%">
      <stop offset="0%" stop-color="#1b2637"/><stop offset="100%" stop-color="#0a0c11"/>
    </radialGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4e4b4"/><stop offset="100%" stop-color="#c69a34"/>
    </linearGradient>
    <linearGradient id="papel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3cf9e"/><stop offset="100%" stop-color="#bda471"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#ceu)"/>

  <!-- Westeros estilizado, deslocado para a esquerda -->
  <g transform="translate(-14 0)">
    <path d="M168 84 Q150 120 162 150 Q142 178 158 206
