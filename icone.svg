  <!-- rosa dos ventos no mar, canto inferior direito -->
  <g transform="translate(400 404)" opacity="0.9">
    <circle r="40" fill="none" stroke="url(#ouro)" stroke-width="3.5"/>
    <path d="M0 -56 L11 -13 L0 -23 L-11 -13 Z" fill="url(#ouro)"/>
