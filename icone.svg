    <path d="M-56 0 L-13 -11 L-23 0 L-13 11 Z" fill="url(#ouro)" opacity="0.55"/>
    <path d="M56 0 L13 -11 L23 0 L13 11 Z" fill="url(#ouro)" opacity="0.55"/>
